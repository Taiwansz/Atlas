<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <style>
      .mono-kicker {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
        letter-spacing: 3px;
        fill: #D8B46A;
        font-weight: 600;
      }
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 64px;
        font-weight: 800;
        fill: #F5F1E8;
        letter-spacing: -0.5px;
      }
      .brand-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 22px;
        fill: #8E929E;
        line-height: 32px;
      }
      .spec-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        fill: #D8B46A;
        letter-spacing: 1.5px;
        font-weight: 600;
      }
      .spec-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        fill: #F5F1E8;
        font-weight: 500;
      }
      .chip-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        fill: #C2C6D1;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="640" fill="#0D0E12" />
  <rect x="1" y="1" width="1278" height="638" stroke="#1D2028" stroke-width="2" />

  <!-- Accent Vertical Pillar -->
  <rect x="80" y="90" width="4" height="460" rx="2" fill="#D8B46A" />

  <!-- Monogram Mark (Top Right) -->
  <g transform="translate(1120, 90)">
    <rect width="80" height="80" rx="8" fill="#14161E" stroke="#252936" stroke-width="1.5" />
    <text x="40" y="55" font-family="-apple-system, sans-serif" font-size="34" fill="#D8B46A" font-weight="800" text-anchor="middle">A</text>
  </g>

  <!-- Content Block -->
  <g transform="translate(115, 140)">
    <!-- Kicker -->
    <text x="0" y="0" class="mono-kicker">SISTEMA OPERACIONAL DE ENGENHARIA // MULTI-AGENTE</text>

    <!-- Title -->
    <text x="0" y="65" class="brand-title">ATLAS OS</text>

    <!-- Description -->
    <text x="0" y="115" class="brand-desc">Orquestração de sistemas inteligentes com governança arquitetural contínua,</text>
    <text x="0" y="148" class="brand-desc">memória cognitiva persistente (ADRs) e eliminação determinística de amnésia institucional.</text>

    <!-- Technical Specs Box -->
    <g transform="translate(0, 195)">
      <rect width="820" height="85" rx="6" fill="#13151D" stroke="#222633" stroke-width="1" />
      <text x="24" y="34" class="spec-label">FOUNDATION &amp; GOVERNANÇA</text>
      <text x="24" y="62" class="spec-val">Filosofia Blueprint-First, pontuação constitucional contínua e memória persistente em grafo.</text>
    </g>

    <!-- Tech Stack Chips -->
    <g transform="translate(0, 315)">
      <text x="0" y="24" class="chip-text">STACK: TypeScript &#183; Node.js &#183; Nx Monorepo &#183; Docker &#183; Multi-Agent Runtimes</text>
    </g>
  </g>
</svg>
